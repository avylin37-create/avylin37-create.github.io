const DATA={"lessons": [{"group": "01 · 被動語態", "title": "誰做動作？誰接受動作？", "goal": "主動句強調動作的執行者；被動句以接受動作的人或物當主詞。", "formula": [["s", "接受者", "被動句主詞"], ["v", "be＋p.p.", "時態在 be；動作用過去分詞"], ["p", "by＋執行者", "需要指出執行者時才加"]], "example": [["s", "My child"], ["v", "was saved"], ["p", "by that man."]], "translation": "我的孩子被那個男人救了。", "steps": [["先找接受者", "That man saved my child.：That man 做動作，my child 接受動作。把 My child 移到句首。"], ["保留原來的時間", "saved 是過去式；My child 是單數，所以用 was＋saved。p.p. 是過去分詞，不是每個字都加 -ed。"], ["最後補執行者", "My child was saved by that man.；by 後放執行者。若改用代名詞，by 後要受格，如 by him。"]]}, {"group": "01 · 被動語態", "title": "現在式與過去式：be 怎麼選？", "goal": "先看時間，再看新主詞的單複數。", "formula": [["s", "主詞", "單數／複數"], ["v", "am / is / are", "現在式"], ["v", "was / were", "過去式"], ["a", "p.p.", "過去分詞"]], "example": [["s", "The cars"], ["v", "weren’t fixed"], ["p", "by Mike."]], "translation": "那些車子不是 Mike 修理的。", "steps": [["現在式", "English is spoken around the world.；The lawyers are paid once a month.。spoken、paid 是過去分詞，整句仍是現在式。"], ["過去式", "The dog was found by a student.；The cars were fixed yesterday.。複數 cars 配 were。"], ["否定與問句", "否定放在 be 後：The cars weren’t fixed.。問句把 be 移到主詞前：Was the hamburger eaten by you?"]]}, {"group": "01 · 被動語態", "title": "by 可省略；地點用 in", "goal": "不是每個被動句都需要 by，也不是每個空格都填 by。", "formula": [["s", "主詞", "被影響的人或物"], ["v", "be＋p.p.", "被動核心"], ["p", "時間／地點", "依句意補充"]], "example": [["s", "The fruit"], ["v", "is grown"], ["p", "in Taiwan."]], "translation": "這種水果在臺灣種植。", "steps": [["不清楚或不重要時可省略", "The money was stolen this morning.：不知道小偷是誰，不必硬加 by someone。"], ["by 說明誰做；in 說明哪裡", "The report was written by Jane’s team.：團隊是執行者。The fruit is grown in Taiwan.：臺灣是地點。"], ["先讀意思再選介系詞", "看到被動語態，仍要判斷後面的名詞是執行者、地點還是其他資訊。"]]}, {"group": "02 · 含助動詞的被動", "title": "will / can / must＋be＋p.p.", "goal": "助動詞後面用原形 be，再接過去分詞。", "formula": [["s", "主詞", "接受者"], ["v", "will / can / must", "助動詞"], ["v", "be", "固定用原形"], ["a", "p.p.", "動作的過去分詞"]], "example": [["s", "The work"], ["v", "must be finished"], ["p", "today."]], "translation": "這項工作今天必須完成。", "steps": [["不能漏 be", "The work will be finished by Maggie.；The building can be seen easily.。will finished、can seen 都少了 be。"], ["否定放在助動詞後", "The knives shouldn’t be put here.。put 的原形、過去式、過去分詞同形。"], ["問句移助動詞", "Can the tickets be bought online?；Will the meeting be held this week?。be 不跟著移到句首。"]]}, {"group": "02 · 含助動詞的被動", "title": "be going to＋be＋p.p.", "goal": "第一個 be 配主詞；to 後的第二個 be 用原形。", "formula": [["s", "主詞", "The information"], ["v", "is going to", "將要"], ["v", "be shared", "被分享"]], "example": [["s", "The information"], ["v", "is going to be shared"], ["p", "with everyone later."]], "translation": "這項資訊稍後將分享給大家。", "steps": [["把 going to 當作將要", "The information is going to…：information 是不可數名詞，用 is。"], ["後面仍需要被動結構", "to 後加 be shared，不是 to shared，也不是 to been shared。"], ["比較主動與被動", "We are going to share the information. → The information is going to be shared by us."]]}, {"group": "02 · 含助動詞的被動", "title": "have / has＋been＋p.p.", "goal": "現在完成式的被動，不能漏掉 been。", "formula": [["s", "主詞", "單數用 has；複數用 have"], ["v", "have / has been", "完成式被動"], ["a", "p.p.", "過去分詞"]], "example": [["s", "The story"], ["v", "has been told"], ["p", "many times."]], "translation": "這個故事已經被講過很多次了。", "steps": [["主動完成式換成被動", "Someone has told the story. → The story has been told.。have / has 後面加 be 的過去分詞 been。"], ["主詞一致與否定", "The tapes have been thrown away by Frank.；The machine hasn’t been fixed.。複數 tapes 配 have。"], ["問句先移 have / has", "Has the video been watched by everyone?。been watched 留在主詞後面。"]]}, {"group": "03 · 附加問句", "title": "前肯後否，前否後肯", "goal": "先確認直述句的肯定或否定，再選同類助動詞。", "formula": [["s", "直述句", "先看主詞與動詞"], ["v", "相反極性", "肯定 ↔ 否定"], ["s", "代名詞？", "與主詞對應"]], "example": [["s", "The boy"], ["v", "is hard-working,"], ["v", "isn’t"], ["s", "he?"]], "translation": "那個男孩很用功，不是嗎？", "steps": [["肯定句接否定附加問句", "Amy likes snacks, doesn’t she?；They will go to the movies, won’t they?"], ["否定句接肯定附加問句", "The boy isn’t hard-working, is he?；You haven’t visited the museum, have you?"], ["否定附加問句通常用縮寫", "is not he ✗；isn’t he ✓。I am 的形式另看後面的特殊句型。"]]}, {"group": "03 · 附加問句", "title": "動詞跟前面，主詞換代名詞", "goal": "be 配 be；一般動詞找 do / does / did；助動詞沿用。", "formula": [["s", "原主詞", "Karen → she"], ["v", "原動詞", "uploaded → did"], ["v", "相反極性", "肯定 → didn’t"]], "example": [["s", "Karen"], ["v", "uploaded the file,"], ["v", "didn’t"], ["s", "she?"]], "translation": "Karen 上傳了那個檔案，不是嗎？", "steps": [["be 動詞照用", "Those firefighters are strong, aren’t they?。原句 are，後面也是 are 的否定形式。"], ["一般動詞找助動詞", "Dan plays basketball well, doesn’t he?；Karen uploaded the file, didn’t she?。注意現在單數用 does，過去用 did。"], ["完成式沿用 have / has", "The machine hasn’t been fixed, has it?。原句最前面的助動詞是 has，不用 is。"]]}, {"group": "03 · 附加問句", "title": "it / they / there 怎麼選？", "goal": "附加問句不重複整個名詞，使用對應代名詞或 there。", "formula": [["s", "this / that / 動名詞", "it"], ["s", "these / those / everyone", "they"], ["s", "there is / are", "there"]], "example": [["s", "Everyone"], ["v", "needs to say something,"], ["v", "don’t"], ["s", "they?"]], "translation": "每個人都需要說些什麼，不是嗎？", "steps": [["事情或單數指示詞用 it", "Making a card isn’t hard, is it?；That is your coat, isn’t it?；nothing、everything、something 也對應 it。"], ["複數與不定人稱用 they", "Those are correct answers, aren’t they?。everyone / everybody / nobody / no one 的附加問句用 they，助動詞也配 they。"], ["there 保留 there", "There aren’t any apples in the fridge, are there?。不是 are they。"]]}, {"group": "03 · 附加問句", "title": "否定字與 have to 的陷阱", "goal": "沒有 not，也可能是否定句；have to 不等於完成式 have。", "formula": [["s", "主詞", "先找主詞"], ["v", "否定線索", "never / seldom / no / little / few"], ["v", "肯定附加問句", "配正確助動詞"]], "example": [["s", "Jim"], ["v", "seldom goes to bed after 9,"], ["v", "does"], ["s", "he?"]], "translation": "Jim 很少九點後才上床，是嗎？", "steps": [["否定字使後面用肯定", "no、never、seldom、nothing、little、few 含否定意思：There is little space in the box, is there?。a little / a few 則表示有一些，不當作否定。"], ["have to 是一般動詞片語", "Wilson has to prepare dinner, doesn’t he?。has to 表示必須，不是現在完成式。"], ["比較兩種 has", "He has finished, hasn’t he?（完成式）；He has to finish, doesn’t he?（必須）；The students have no homework, do they?（no 是否定）。"]]}, {"group": "04 · 特殊形式與回答", "title": "I am、祈使句與 Let’s", "goal": "特殊句型要整組記，仍要理解句子的用途。", "formula": [["s", "I am…", "aren’t I? / am I not?"], ["v", "一般祈使句", "will you?"], ["s", "Let’s…", "shall we?"]], "example": [["v", "Let’s dance,"], ["v", "shall"], ["s", "we?"]], "translation": "我們來跳舞吧，好嗎？", "steps": [["I am 的附加問句", "I am wrong, aren’t I? 或 I am wrong, am I not?。不用 amn’t I。"], ["一般要求與邀請", "Help me move the refrigerator, will you?；Don’t be late, will you?。課本表示請客、邀約時常用 Have some coffee, won’t you?，不是所有祈使句都只能有一種形式。"], ["Let’s 是邀大家一起做", "Let’s dance, shall we?。Let us 若表示請求對方允許，則可接 will you?，不要只看 let 這個字。"]]}, {"group": "04 · 特殊形式與回答", "title": "找主要子句；依事實回答", "goal": "有兩個子句時先找主要子句；Yes / No 看事實是否成立。", "formula": [["s", "主要子句主詞", "Mom → she"], ["v", "主要子句動詞", "thinks → does"], ["v", "否定附加問句", "doesn’t she?"]], "example": [["s", "Mom"], ["v", "thinks you will go home earlier,"], ["v", "doesn’t"], ["s", "she?"]], "translation": "媽媽認為你會早點回家，不是嗎？", "steps": [["一般依主要子句", "They were practicing dancing when you called them, weren’t they?。主要子句是 They were practicing dancing。"], ["不要看見 will 就選 won’t", "Mom thinks you will go home earlier, doesn’t she?。主要句是 Mom thinks。本課先掌握這個規則；I think / I don’t think 等第一人稱表達想法另有慣用判斷，不宜一概套用。"], ["回答看事實", "Leo will drive carefully, won’t he? 肯定簡答：Yes, he will.。即使問 Leo won’t drive carefully, will he?，若事實是他會小心開，仍答 Yes, he will."]]}], "questions": [{"id": 1, "cat": "被動語態", "stem": "Those pancakes ___ by Dora and her sister.", "options": ["were making", "made", "were made", "to make"], "answer": 2, "structure": "主詞＋be／助動詞＋被動結構（p.p.）。", "clue": "pancakes 是接受製作的物品；主詞複數。", "why": "用 were made 表示鬆餅被製作。", "lesson": 1, "optionNotes": ["were making 是主動進行式。", "made 單獨沒有被動 be。", "were＋made 是正確的被動。", "不定詞不能單獨作本句動詞。"]}, {"id": 2, "cat": "被動語態", "stem": "The fruit is grown ___ Taiwan. It is very sweet.", "options": ["by", "in", "from", "with"], "answer": 1, "structure": "主詞＋be／助動詞＋被動結構（p.p.）。", "clue": "Taiwan 在這裡是種植地點。", "why": "在臺灣種植用 in Taiwan；by 後接動作執行者。", "lesson": 2, "optionNotes": ["by 不表達本句種植地點。", "in 表示在某地。", "from 表示來源，非本句種植所在地。", "with 表示伴隨或工具，非地點。"]}, {"id": 3, "cat": "被動語態", "stem": "The report was written ___ Jane’s team.", "options": ["in", "by", "over", "to be"], "answer": 1, "structure": "主詞＋be／助動詞＋被動結構（p.p.）。", "clue": "Jane’s team 是寫報告的執行者。", "why": "被動句以 by＋執行者說明誰寫報告。", "lesson": 2, "optionNotes": ["in 不是引出執行者。", "by 引出寫報告的團隊。", "over 不引出執行者。", "to be 不符合介系詞位置。"]}, {"id": 4, "cat": "被動語態", "stem": "The work must ___ by this Friday, so we have to hurry up.", "options": ["do", "be doing", "done", "be done"], "answer": 3, "structure": "主詞＋be／助動詞＋被動結構（p.p.）。", "clue": "must 後用原形；work 接受完成的動作。", "why": "must be done＝必須被完成。", "lesson": 3, "optionNotes": ["do 是主動原形。", "be doing 是主動進行式。", "done 前缺 be。", "be done 是被動原形結構。"]}, {"id": 5, "cat": "被動語態", "stem": "Mia: Did you see my strawberry pie?\nEric: I think it has ___ by Tom.", "options": ["to eat", "eaten", "been eaten", "be eaten"], "answer": 2, "structure": "主詞＋be／助動詞＋被動結構（p.p.）。", "clue": "has 是完成式助動詞；派被 Tom 吃掉。", "why": "has been eaten 是現在完成式被動。", "lesson": 5, "optionNotes": ["has to eat 表示必須吃，不是被吃。", "has eaten 是主動完成式。", "been eaten 符合完成式被動。", "has 後需 been，不能用 be。"]}, {"id": 6, "cat": "被動語態", "stem": "The questions ___ asked tomorrow. Please be prepared.", "options": ["might be", "are going to", "will", "be"], "answer": 0, "structure": "主詞＋be／助動詞＋被動結構（p.p.）。", "clue": "asked 是過去分詞；需要助動詞＋be。", "why": "might be asked＝可能會被問到。", "lesson": 3, "optionNotes": ["might be＋asked 完整。", "are going to 後缺 be。", "will 後缺 be。", "be 不能單獨配主詞作限定動詞。"]}, {"id": 7, "cat": "被動語態", "stem": "English ___ around the world.", "options": ["speaks", "is spoken", "is speaking", "spoke"], "answer": 1, "structure": "主詞＋be／助動詞＋被動結構（p.p.）。", "clue": "English 是被使用的語言；一般事實。", "why": "一般現在式被動：English is spoken。", "lesson": 1, "optionNotes": ["speaks 是主動。", "is spoken 是單數現在被動。", "is speaking 是主動進行式。", "spoke 是主動過去式。"]}, {"id": 8, "cat": "被動語態", "stem": "The cars ___ fixed by Mike yesterday.", "options": ["was", "is", "were", "be"], "answer": 2, "structure": "主詞＋be／助動詞＋被動結構（p.p.）。", "clue": "cars 複數，yesterday 過去。", "why": "過去式複數用 were fixed。", "lesson": 1, "optionNotes": ["was 配單數。", "is 是現在單數。", "were 配過去複數。", "be 原形不能獨立作此句限定動詞。"]}, {"id": 9, "cat": "被動語態", "stem": "The information is going to ___ with everyone later.", "options": ["shared", "been shared", "sharing", "be shared"], "answer": 3, "structure": "主詞＋be／助動詞＋被動結構（p.p.）。", "clue": "going to 後用原形；資訊被分享。", "why": "is going to be shared 保留將來式與被動。", "lesson": 4, "optionNotes": ["shared 前少 be。", "to 後不能用 been。", "sharing 不是原形被動結構。", "be shared 是原形被動。"]}, {"id": 10, "cat": "被動語態", "stem": "The tapes ___ thrown away by Frank already.", "options": ["have been", "has been", "have", "were been"], "answer": 0, "structure": "主詞＋be／助動詞＋被動結構（p.p.）。", "clue": "tapes 複數；already，已被丟掉。", "why": "複數現在完成式被動用 have been thrown。", "lesson": 5, "optionNotes": ["have been 符合複數完成式被動。", "has 配單數。", "have thrown 是主動。", "were been 不符合此完成式。"]}, {"id": 11, "cat": "被動語態", "stem": "___ the tickets be bought online?", "options": ["Are", "Can", "Have", "Do"], "answer": 1, "structure": "主詞＋be／助動詞＋被動結構（p.p.）。", "clue": "主詞後已有 be bought。", "why": "Can＋主詞＋be＋p.p.？詢問能否網購。", "lesson": 3, "optionNotes": ["Are 不能接這裡的 be bought。", "Can 後可用 be bought。", "Have 的完成式需 been。", "Do 不搭這個被動結構。"]}, {"id": 12, "cat": "被動語態", "stem": "The house has ___ to Mr. and Mrs. White. (sell)", "options": ["sold", "be sold", "been sold", "been selling"], "answer": 2, "structure": "主詞＋be／助動詞＋被動結構（p.p.）。", "clue": "has 後接 been；房子被售出。", "why": "sell–sold–sold；has been sold。", "lesson": 5, "optionNotes": ["has sold 是主動。", "has 後用 been。", "完成式被動結構正確。", "been selling 是主動完成進行式。"]}, {"id": 13, "cat": "被動語態", "stem": "Jenny ___ by a dog last night, but it was nothing serious.", "options": ["was bitten", "is bitten", "bit", "was bite"], "answer": 0, "structure": "主詞＋be／助動詞＋被動結構（ ", "do they", "haven’t they"], "answer": 2, "structure": "直述句＋對應助動詞＋代名詞？（一般前肯後否、前否後肯）", "clue": "no 是否定；have 表示擁有，非完成式。", "why": "本課一般動詞 have 使用 do；否定句接肯定 do they。", "lesson": 9, "optionNotes": ["no 使前句為否定，後面不再否定。", "本課擁有用一般動詞 do。", "do they 正確。", "不是完成式，且不應再否定。"]}, {"id": 19, "cat": "附加問句", "stem": "These are all real animals, ___?", "options": ["aren’t they", "are they", "isn’t it", "is it"], "answer": 0, "structure": "直述句＋對應助動詞＋代名詞？（一般前肯後否、前否後肯）", "clue": "These 複數；are 肯定。", "why": "these → they，are → aren’t。", "lesson": 8, "optionNotes": ["aren’t they 正確。", "應用否定。", "單數代名詞與動詞不符。", "單複數與極性不符。"]}, {"id": 20, "cat": "附加問句", "stem": "There won’t be a lot of people because of the weather, ___?", "options": ["won’t there", "will they", "aren’t there", "will there"], "answer": 3, "structure": "直述句＋對應助動詞＋代名詞？（一般前肯後否、前否後肯）", "clue": "there 結構；won’t 是否定助動詞。", "why": "保留 there，改肯定 will。", "lesson": 8, "optionNotes": ["前否後肯，不再 won’t。", "there 結構保留 there。", "原助動詞是 will，不是 are。", "will there 正確。"]}, {"id": 21, "cat": "附加問句", "stem": "Wilson has to prepare dinner by himself, ___?", "options": ["hasn’t he", "doesn’t he", "does he", "isn’t he"], "answer": 1, "structure": "直述句＋對應助動詞＋代名詞？（一般前肯後否、前否後肯）", "clue": "has to＝必須，是一般動詞片語。", "why": "Wilson 單數，肯定現在式 has to 配 doesn’t he。", "lesson": 9, "optionNotes": ["has to 非完成式，不用 hasn’t。", "doesn’t he 正確。", "前肯後否。", "原句沒有 be 動詞。"]}, {"id": 22, "cat": "附加問句", "stem": "The children should never go into this room, ___?", "options": ["shouldn’t they", "do they", "should they", "aren’t they"], "answer": 2, "structure": "直述句＋對應助動詞＋代名詞？（一般前肯後否、前否後肯）", "clue": "never 是否定；助動詞 should。", "why": "前句含 never，附加問句用肯定 should they。", "lesson": 9, "optionNotes": ["never 後應肯定。", "沿用 should，不用 do。", "should they 正確。", "原句不用 are。"]}, {"id": 23, "cat": "附加問句", "stem": "Everyone needs to say something, ___?", "options": ["don’t they", "doesn’t he", "do they", "isn’t it"], "answer": 0, "structure": "直述句＋對應助動詞＋代名詞？（一般前肯後否、前否後肯）", "clue": "everyone 在附加問句用 they。", async function submitHomework(mode){

}
