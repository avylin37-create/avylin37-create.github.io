<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Avy English｜B5-U3 教師成績</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#173b3a;font:700 17px/1.8 'Comic Sans MS','Microsoft JhengHei',sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:32px}a{color:#156f66}input,button{font:inherit;padding:10px 15px;border:1px solid #b9cebf;border-radius:10px;max-width:100%}button{background:#156f66;color:white;cursor:pointer}button:disabled{opacity:.5}input{background:white;color:#173b3a}.card,details{background:white;border:1px solid #d7e1d9;border-radius:16px;padding:24px;margin-top:18px}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}summary{cursor:pointer}.note{font-size:14px;color:#5b706e}.error{color:#a34e26}label{display:block;margin:12px 0}table{border-collapse:collapse;width:100%}th,td{padding:10px;text-align:left;border-bottom:1px solid #ddd}.scroll{overflow:auto}[hidden]{display:none!important}:focus-visible{outline:3px solid #ce8f29;outline-offset:3px}
</style></head><body><main><p>AVY ENGLISH · 教師專區</p><h1>B5-U3 作業成績</h1><p>查看每次繳交、逐題答案與不確定的題目，或下載成績表。</p><a href="index.html">← 回到學生練習</a><form class="card" id="login"><label for="password">教師密碼</label><input id="password" type="password" required autocomplete="current-password"><button id="enter">查看成績</button></form><p role="status" id="status"></p><section id="dashboard" hidden><div class="tools"><input id="filter" placeholder="搜尋姓名或班級" aria-label="搜尋姓名或班級"><button id="refresh">重新整理</button><button id="download">下載成績 CSV</button><button id="logout">離開教師專區</button></div><p id="count"></p><div id="records"></div></section><p class="note">學生須在完成頁按「繳交給 Avy 老師」，老師才會收到紀錄。教師密碼請自行保留。</p></main><script>
'use strict';
const API='https://avy-b5-u3-classroom.avylin37.chatgpt.site/api/records';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let password='',rows=[],busy=false;
const filtered=()=>rows.filter(r=>(r.name+' '+r.className).includes($('#filter').value));
const time=s=>new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});
function render(){const list=filtered();$('#count').textContent=`共 ${list.length} 筆繳交紀錄`;$('#records').innerHTML=list.length?list.map(r=>`<details><summary>${esc(r.name)} · ${esc(r.className)}　${Math.round(r.correct/r.total*1000)/10} 分（${r.correct}/${r.total}）<br><span class="note">${r.mode==='exam'?'自我驗收':'自主練習'} · ${esc(time(r.createdAt))}</span></summary><div class="scroll"><table><thead><tr><th>題號</th><th>學生答案</th><th>正確答案</th><th>結果</th></tr></thead><tbody>${JSON.parse(r.details).map(d=>`<tr><td>${d.id}</td><td>${'ABCD'[d.choice]}</td><td>${'ABCD'[d.answer]}</td><td>${d.correct?'✓ 答對':'✗ 答錯'}${d.unsure?'／不確定':''}</td></tr>`).join('')}</tbody></table></div></details>`).join(''):'<div class="card">目前沒有符合條件的繳交紀錄。</div>'}
async function load(){if(busy)return;busy=true;$('#enter').disabled=$('#refresh').disabled=true;$('#status').textContent='正在讀取成績…';$('#status').className='';try{let all=[],cursor='';do{const r=await fetch(API+(cursor?'?before='+encodeURIComponent(cursor):''),{headers:{Authorization:'Bearer '+password},cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'讀取失敗');all.push(...data.rows);cursor=data.next||''}while(cursor);rows=all;$('#login').hidden=true;$('#dashboard').hidden=false;$('#status').textContent='成績已更新。';render()}catch(e){$('#status').className='error';$('#status').textContent=e.message==='Failed to fetch'?'連線失敗，請確認網路後再試。':e.message}finally{busy=false;$('#enter').disabled=$('#refresh').disabled=false}}
$('#login').onsubmit=e=>{e.preventDefault();password=$('#password').value;load()};$('#refresh').onclick=load;$('#filter').oninput=render;$('#logout').onclick=()=>{password='';rows=[];$('#password').value='';$('#records').replaceChildren();$('#dashboard').hidden=true;$('#login').hidden=false;$('#status').textContent='已離開教師專區。'};
$('#download').onclick=()=>{const safe=v=>'"'+(/^[=+@\-\t\r]/.test(String(v))?"'":'')+String(v).replaceAll('"','""')+'"';const table=[['姓名','班級','模式','答對','題數','分數','繳交時間','錯題'],...filtered().map(r=>[r.name,r.className,r.mode==='exam'?'自我驗收':'自主練習',r.correct,r.total,Math.round(r.correct/r.total*1000)/10,time(r.createdAt),JSON.parse(r.details).filter(d=>!d.correct).map(d=>d.id).join('、')])];const url=URL.createObjectURL(new Blob(['\uFEFF'+table.map(row=>row.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='B5-U3_學生成績.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
