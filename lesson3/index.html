<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#0b4c84">
  <title>Lesson 3 Google Meet Low-Data Practice</title>
  <style>
    :root{
      --navy:#12395f;--blue:#1677c8;--blue2:#3fa7e8;--cream:#fffaf0;
      --yellow:#ffd54f;--green:#21a179;--red:#e55368;--ink:#18324a;
      --muted:#65788a;--line:#d8e6f1;--white:#fff;--scale:1;
      --font:"Comic Sans MS","Arial Rounded MT Bold","Noto Sans TC",sans-serif;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eaf3f9}
    body{font-family:var(--font);font-weight:700;color:var(--ink);font-size:calc(16px * var(--scale))}
    button{font:inherit;font-weight:900;border:0;cursor:pointer;color:inherit}
    button:focus-visible{outline:4px solid #ffb703;outline-offset:2px}
    .app{height:100%;display:grid;grid-template-rows:68px 54px 1fr;background:linear-gradient(135deg,#f6fbff,#eaf4fa)}
    header{display:flex;align-items:center;gap:18px;padding:8px 20px;background:#fff;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;min-width:max-content}
    .official-logo{display:block;width:auto;height:56px;object-fit:contain}
    .meet-note{display:flex;align-items:center;gap:8px;margin-left:auto;padding:8px 13px;border-radius:12px;background:#edf8f5;color:#157357;font-size:13px}
    .signal{width:10px;height:10px;border-radius:50%;background:#2eb98a}
    .header-tools{display:flex;gap:7px}.icon-btn{min-width:40px;height:40px;border-radius:10px;background:#edf4f9;color:var(--navy);font-size:15px}.icon-btn:hover{background:#dcecf7}.fullscreen-btn{min-width:88px;padding:0 12px;background:#dceef9;color:#0b5f9c}
    nav{display:flex;align-items:center;justify-content:center;gap:10px;background:#f8fbfd;border-bottom:1px solid var(--line);padding:6px}
    .nav-btn{min-width:155px;height:41px;border-radius:11px;background:#e9f2f8;color:#31546f;font-size:17px}
    .nav-btn.active{background:var(--blue);color:#fff}
    .stage{position:relative;min-height:0;padding:14px 20px 18px}
    .screen{display:none;width:min(1180px,100%);height:100%;margin:auto}.screen.active{display:block}
    .card{height:100%;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 25px rgba(35,74,104,.10);overflow:hidden}
    .learn-layout{height:100%;display:grid;grid-template-columns:56% 44%}
    .photo-side{padding:18px;background:#eef6fb;display:grid;grid-template-rows:1fr auto;gap:12px}
    .photo{width:min(100%,calc(100vh - 330px));height:auto;aspect-ratio:1;min-height:0;place-self:center;border-radius:16px;background-color:#f3f6f8;background-repeat:no-repeat;background-size:contain;background-position:center;box-shadow:inset 0 0 0 1px rgba(20,65,100,.12);position:relative}
    .photo-controls{display:flex;justify-content:center;gap:9px}
    .word-side{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;text-align:center}
    .counter{display:inline-flex;padding:7px 13px;border-radius:999px;background:#edf5fa;color:#527086;font-size:14px;margin-bottom:14px}
    .word{font-size:clamp(52px,6vw,82px);line-height:1;color:var(--navy);margin:0 0 13px}
    .chinese{font-size:clamp(25px,3vw,38px);color:#4f6575;margin:0 0 20px;min-height:50px}
    .hint{color:#789;min-height:26px;font-size:14px}
    .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .btn{min-width:120px;padding:12px 17px;border-radius:12px;background:#e9f2f8;color:#214966}
    .btn:hover{background:#d8eaf6}.btn.primary{background:var(--yellow);color:#4e3d00}.btn.blue{background:var(--blue);color:white}.btn.red{background:#ffe5e9;color:#a62f44}
    .btn:disabled{opacity:.45;cursor:default}
    .practice-layout{height:100%;display:grid;grid-template-rows:52px 1fr}
    .modebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 14px;border-bottom:1px solid var(--line);background:#fbfdff}
    .mode-left{display:flex;gap:7px}.mode{padding:8px 13px;border-radius:9px;background:#edf4f9;color:#49677d}.mode.active{background:var(--navy);color:#fff}
    .stats{display:flex;gap:18px;font-size:16px;color:#45657b}.stats strong{color:var(--navy)}
    .question-area{min-height:0;padding:14px 20px 16px;display:grid;grid-template-columns:47% 53%;gap:20px}
    .prompt-panel{min-height:0;background:#eef6fb;border-radius:16px;padding:14px;display:grid;grid-template-rows:auto 1fr auto;text-align:center}
    .question-label{font-size:15px;color:#60778a;margin-bottom:8px}
    .prompt-panel .photo{min-height:0}
    .zh-prompt,.listen-prompt{display:grid;place-items:center;height:100%;font-size:clamp(38px,5vw,64px);color:var(--navy);line-height:1.25;padding:20px}
    .listen-prompt button{width:160px;height:160px;border-radius:50%;background:#ddecf7;color:var(--blue);font-size:72px}
    .prompt-word{font-size:22px;color:#49677d;min-height:33px;padding-top:8px}
    .answer-panel{display:flex;flex-direction:column;justify-content:center;min-height:0}
    .answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .answer{min-height:82px;padding:12px;border-radius:14px;background:#f3f7fa;border:3px solid #d8e6f0;font-size:clamp(22px,2.5vw,34px);color:var(--navy)}
    .answer:hover{border-color:#74b8e5;background:#edf7fd}.answer.correct{background:#ddf7ee;border-color:#31ad84;color:#126f53}.answer.wrong{background:#ffe4e8;border-color:#e96c7f;color:#a62f44}
    .article-rule{display:flex;align-items:center;gap:12px;color:#31546f;font-size:15px}.article-rule strong{font-size:25px;color:var(--blue)}
    .article-photo{background-size:contain!important;background-repeat:no-repeat!important;background-position:center!important}
    .article-phrase{font-size:clamp(32px,4vw,54px);color:var(--navy);padding-top:8px}.article-blank{display:inline-block;min-width:82px;color:var(--blue);border-bottom:4px solid #8fc5e7;margin-right:8px}
    .article-answers{grid-template-columns:1fr 1fr}.article-answer{min-height:118px;font-size:clamp(42px,5vw,68px);text-transform:lowercase}
    .feedback{height:51px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#596f7f}.feedback.good{color:#16805f}.feedback.bad{color:#bc3f53}
    .question-actions{display:flex;justify-content:center;gap:9px}
    .game-layout{height:100%;display:grid;grid-template-rows:65px 1fr}
    .gamebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 17px;background:#fbfdff;border-bottom:1px solid var(--line)}
    .team-name{font-size:26px;color:var(--navy)}.scorebox{text-align:right;font-size:18px;color:#526b7e}.scorebox strong{font-size:34px;color:var(--blue);margin-left:8px}
    .timer{display:flex;align-items:center;gap:9px;padding:8px 17px;border-radius:13px;background:#fff5ca;color:#6c5300;font-size:18px}.timer strong{font-size:32px;line-height:1}
    .game-controls{display:flex;justify-content:flex-end;gap:7px}
    .game-content{min-height:0;padding:13px 18px 15px;display:grid;grid-template-columns:47% 53%;gap:18px}
    .game-start,.game-end{grid-column:1/-1;display:grid;place-items:center;text-align:center}.game-start-inner,.game-end-inner{max-width:720px}
    .game-start h1,.game-end h1{font-size:47px;color:var(--navy);margin:10px}.game-start p{font-size:20px;line-height:1.7;color:#5a7182}
    .big-score{font-size:110px;color:var(--blue);line-height:1;margin:12px}
    .self-layout{height:100%;display:grid;grid-template-rows:65px 1fr}
    .selfbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 17px;background:#fbfdff;border-bottom:1px solid var(--line)}
    .self-title{font-size:23px;color:var(--navy)}
    .self-timer{display:flex;align-items:center;gap:9px;padding:8px 17px;border-radius:13px;background:#fff5ca;color:#6c5300;font-size:16px}.self-timer strong{font-size:31px;line-height:1}
    .self-stats{text-align:right;font-size:16px;color:#526b7e}.self-stats strong{font-size:24px;color:var(--blue);margin:0 5px}
    .self-content{min-height:0;padding:13px 18px 15px;display:grid;grid-template-columns:47% 53%;gap:18px}
    .self-start,.self-end{grid-column:1/-1;display:grid;place-items:center;text-align:center}.self-start-inner,.self-end-inner{max-width:760px}
    .self-start h1,.self-end h1{font-size:44px;color:var(--navy);margin:8px}.self-start p{font-size:19px;line-height:1.65;color:#5a7182;margin:10px 0 18px}
    .self-rules{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0 22px}.self-rule{padding:9px 13px;border-radius:10px;background:#edf6fb;color:#31546f;font-size:15px}
    .self-result{font-size:24px;color:#49677d}.self-result strong{font-size:72px;color:var(--blue)}
    .self-mode-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:#dceef9;color:#24516e;font-size:14px;margin-bottom:7px}
    .spell-box{display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0;text-align:center}
    .spell-answer{min-height:76px;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border:3px dashed #8fc5e7;border-radius:15px;background:#f7fcff;font-size:38px;color:var(--navy);letter-spacing:3px}
    .letter-bank{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:10px}
    .letter-tile{width:56px;height:56px;border-radius:12px;background:#fff2b8;border:3px solid #efca49;color:#523f00;font-size:29px;text-transform:lowercase;box-shadow:0 4px 0 #d3aa29}
    .letter-tile:disabled{opacity:.25;box-shadow:none;transform:translateY(4px)}
    .write-box{display:grid;grid-template-rows:auto 1fr auto;gap:9px;min-height:0;text-align:center}
    .write-board{min-height:0;border:3px solid #9ac8e4;border-radius:16px;background:repeating-linear-gradient(#fff 0,#fff 46px,#d8e8f2 47px,#d8e8f2 49px);overflow:hidden;position:relative}
    #selfCanvas{display:block;width:100%;height:100%;min-height:210px;touch-action:none;cursor:crosshair}
    .revealed-word{font-size:48px;color:var(--blue);line-height:1.1;margin:4px}.reveal-help{font-size:16px;color:#5d7485}
    .result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:15px auto;max-width:650px}.result-card{padding:13px;border-radius:14px;background:#edf6fb;color:#49677d}.result-card strong{display:block;font-size:34px;color:var(--blue)}
    .growth{display:inline-block;padding:9px 16px;border-radius:999px;background:#e5f7ee;color:#167252;font-size:19px;margin:4px 0 12px}.growth.keep{background:#fff3cc;color:#715500}
    .teacher-panel{position:fixed;right:18px;bottom:14px;z-index:30;display:none;gap:6px;padding:8px;background:#162f45;border-radius:12px}.teacher-on .teacher-panel{display:flex}.teacher-panel button{padding:8px 10px;border-radius:7px;background:#fff;color:#18324a;font-size:12px}
    .teacher-badge{display:none;position:fixed;left:14px;bottom:12px;z-index:25;background:#162f45;color:#fff;border-radius:8px;padding:6px 10px;font:700 11px Arial}.teacher-on .teacher-badge{display:block}
    .modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(10,34,52,.55)}.modal.show{display:grid}
    .modal-box{width:min(380px,90vw);padding:25px;border-radius:18px;background:#fff;text-align:center}.modal-box h2{margin-top:0;color:var(--navy)}
    .pin{width:100%;padding:12px;border:3px solid var(--line);border-radius:10px;text-align:center;font:900 27px var(--font);letter-spacing:8px}
    .toast{position:fixed;z-index:60;left:50%;bottom:20px;transform:translate(-50%,100px);padding:11px 18px;border-radius:10px;background:#16334a;color:white;transition:.15s}.toast.show{transform:translate(-50%,0)}
    .focus-mode .app{grid-template-rows:54px 48px 1fr}.focus-mode .brand,.focus-mode .meet-note,.focus-mode #zoomOut,.focus-mode #zoomIn,.focus-mode #teacherBtn{display:none}.focus-mode header{justify-content:flex-end;padding:6px 16px}
    @media(max-width:900px){.meet-note{display:none}.official-logo{height:49px}.nav-btn{min-width:102px;font-size:14px}.learn-layout,.question-area,.game-content,.self-content{grid-template-columns:50% 50%}.word{font-size:52px}.chinese{font-size:26px}.stage{padding:10px}.answer{min-height:72px;font-size:22px}}
    @media(max-height:650px){.app{grid-template-rows:58px 46px 1fr}header{padding:5px 16px}.official-logo{height:46px}.nav-btn{height:35px}.stage{padding:8px 15px 10px}.photo-side{padding:12px}.question-area,.game-content,.self-content{padding:9px 14px}.answer{min-height:62px}.word{font-size:50px}.chinese{font-size:25px}.btn{padding:9px 13px}.letter-tile{width:47px;height:47px;font-size:25px}.spell-answer{min-height:62px}.self-start h1,.self-end h1{font-size:37px}.self-start p{font-size:16px}}
  </style>
</head>

  function selfItem(){if(selfPractice.index>=selfPractice.order.length)selfPractice.order.push(...shuffle(words));return selfPractice.order[selfPractice.index]}
  function selfArticleItem(){if(selfPractice.articleRetry.length)return selfPractice.articleRetry.shift();if(selfPractice.articleIndex>=selfPractice.articleOrder.length)selfPractice.articleOrder.push(...shuffle(articleWords));return selfPractice.articleOrder[selfPractice.articleIndex++]}
  function updateSelfBar(){$("#selfTime").textContent=formatTime(selfPractice.time);$("#selfScore").textContent=selfPractice.score;$("#selfTotal").textContent=selfPractice.total}
  function renderSelf(){
    updateSelfBar();
    if(!selfPractice.started){
      const record=selfPractice.last?'<p style="margin:0;color:#31546f">上次答對 <strong>'+selfPractice.last+'</strong> 題｜最佳 <strong>'+selfPractice.best+'</strong> 題</p>':'';
      $("#selfContent").innerHTML='<div class="self-start"><div class="self-start-inner"><div style="font-size:58px">⏱️✍️</div><h1>15-Minute Self Practice</h1><p>在 15 分鐘內反覆練習單字與 a / an。題型會自動輪流出現，<br>答錯的題目還會再回來，直到越來越熟！</p><div class="self-rules"><span class="self-rule">📷 看圖四選一</span><span class="self-rule">中文四選一</span><span class="self-rule">🔊 聽音四選一</span><span class="self-rule">🍎 a / an</span><span class="self-rule">🔤 點字母拼單字</span><span class="self-rule">✍️ 手寫＋自己核對</span></div>'+record+'<button class="btn primary" id="startSelf" style="margin-top:15px">Start 15 Minutes</button></div></div>';
      $("#startSelf").onclick=startSelf;return;
    }
    if(selfPractice.time<=0){
      const accuracy=selfPractice.total?Math.round(selfPractice.score/selfPractice.total*100):0;
      const first=!selfPractice.previous,gain=selfPractice.score-selfPractice.previous;
      const growth=first?'這是第一次紀錄，下次挑戰超過 '+selfPractice.score+' 題！':gain>0?'比上次進步 ＋'+gain+' 題！':gain===0?'和上次一樣，下一次再多答對 1 題！':'下次目標：追回 '+Math.abs(gain)+' 題，再突破自己！';
      const growthClass=gain>0?'growth':'growth keep';
      $("#selfContent").innerHTML='<div class="self-end"><div class="self-end-inner"><div style="font-size:54px">🎉</div><h1>15 minutes finished!</h1><div class="self-result">本次答對 <strong>'+selfPractice.score+'</strong> 題</div><div class="'+growthClass+'">'+growth+'</div><div class="result-grid"><div class="result-card">完成題數<strong>'+selfPractice.total+'</strong></div><div class="result-card">正確率<strong>'+accuracy+'%</strong></div><div class="result-card">最佳紀錄<strong>'+selfPractice.best+'</strong></div></div><p style="font-size:16px;color:#5a7182">需要再複習的單字：'+(selfPractice.missed.length?selfPractice.missed.join('、'):'全部都很熟！')+'</p><button class="btn primary" id="againSelf">下次再挑戰</button></div></div>';
      $("#againSelf").onclick=resetSelf;return;
    }
    const mode=["photo","zh","listen","article","spell","write"][selfPractice.index%6],item=mode==="article"?selfArticleItem():selfItem();
    let prompt='',label='';
    if(mode==="photo"){label="Which word matches the photo?";prompt='<div id="selfPhoto" class="photo"></div>'}
    if(mode==="zh"){label="Choose the correct English word.";prompt='<div class="zh-prompt">'+item.z+'</div>'}
    if(mode==="listen"){label="Listen and choose the word.";prompt='<div class="listen-prompt"><button id="selfListen" aria-label="播放英文單字">🔊</button></div>'}
    if(mode==="article"){renderSelfArticle(item);return}
    if(mode==="spell"){renderSelfSpell(item);return}
    if(mode==="write"){renderSelfWrite(item);return}
    $("#selfContent").innerHTML='<div class="prompt-panel"><div><div class="self-mode-tag">四選一</div><div class="question-label">'+label+'</div></div>'+prompt+'<div class="prompt-word">第 '+(selfPractice.index+1)+' 題</div></div><div class="answer-panel"><div id="selfAnswers" class="answers">'+choices(item).map((x,i)=>'<button class="answer" data-word="'+x.w+'">'+String.fromCharCode(65+i)+'. '+x.w+'</button>').join('')+'</div><div id="selfFeedback" class="feedback">選一個答案</div></div>';
    if(mode==="photo")setPhoto($("#selfPhoto"),item);
    if(mode==="listen"){$("#selfListen").onclick=()=>speak(item.w);setTimeout(()=>selfPractice.running&&speak(item.w),250)}
    $$("#selfAnswers .answer").forEach(b=>b.onclick=()=>checkSelfChoice(b,item));
  }
  function startSelfClock(){clearInterval(selfPractice.timer);selfPractice.running=true;selfPractice.timer=setInterval(()=>{selfPractice.time=Math.max(0,selfPractice.time-1);updateSelfBar();if(selfPractice.time===0)finishSelf()},1000)}
  function startSelf(){selfPractice={...selfPractice,started:true,running:true,time:900,score:0,total:0,index:0,order:shuffle(words),articleOrder:shuffle(articleWords),articleIndex:0,articleRetry:[],timer:null,locked:false,previous:selfPractice.last,missed:[],selected:[]};startSelfClock();renderSelf()}
  function markMissed(item){const label=item.kind==="article"?item.a+" "+item.w:item.w;if(!selfPractice.missed.includes(label))selfPractice.missed.push(label);if(item.kind==="article")selfPractice.articleRetry.push(item);else selfPractice.order.splice(Math.min(selfPractice.index+4,selfPractice.order.length),0,item)}
  function completeSelf(ok,item,delay=750){selfPractice.total++;if(ok)selfPractice.score++;else markMissed(item);updateSelfBar();selfPractice.locked=true;setTimeout(()=>{if(!selfPractice.running)return;selfPractice.index++;selfPractice.locked=false;selfPractice.selected=[];renderSelf()},delay)}
  function checkSelfChoice(btn,item){
    if(selfPractice.locked||!selfPractice.running||btn.disabled)return;
    const ok=btn.dataset.word===item.w;$$("#selfAnswers .answer").forEach(b=>{b.disabled=true;if(b.dataset.word===item.w)b.classList.add("correct")});if(!ok)btn.classList.add("wrong");$("#selfFeedback").textContent=ok?"Great job! ✓":item.w+" = "+item.z+"｜這個字等一下會再出現";$("#selfFeedback").className="feedback "+(ok?"good":"bad");speak(item.w);completeSelf(ok,item,ok?650:1150)
  }
  function renderSelfArticle(item){
    $("#selfContent").innerHTML='<div class="prompt-panel"><div><div class="self-mode-tag">🍎 a / an</div><div class="question-label">看照片，選擇正確的 a 或 an</div></div><div id="selfArticlePhoto" class="photo article-photo"></div><div class="article-phrase"><span class="article-blank">___</span> '+item.w+'</div></div><div class="answer-panel"><div id="selfArticleAnswers" class="answers article-answers"><button class="answer article-answer" data-article="a">a</button><button class="answer article-answer" data-article="an">an</button></div><div id="selfFeedback" class="feedback">選擇 a 或 an</div></div>';setArticlePhoto($("#selfArticlePhoto"),item);$$("#selfArticleAnswers .article-answer").forEach(b=>b.onclick=()=>checkSelfArticle(b,item))
  }
  function checkSelfArticle(btn,item){if(selfPractice.locked||!selfPractice.running)return;const ok=btn.dataset.article===item.a;$$("#selfArticleAnswers .article-answer").forEach(b=>{b.disabled=true;if(b.dataset.article===item.a)b.classList.add("correct")});if(!ok)btn.classList.add("wrong");$("#selfFeedback").textContent=(ok?"Great! ":"答案是 ")+item.a+" "+item.w+(ok?"":"｜這一題等一下會再出現");$("#selfFeedback").className="feedback "+(ok?"good":"bad");speak(item.a+" "+item.w);completeSelf(ok,item,ok?650:1100)}
  function renderSelfSpell(item){
    selfPractice.selected=[];const extra="abcdefghijklmnopqrstuvwxyz".replaceAll(item.w[0],"")[Math.floor(Math.random()*25)]||"x",letters=shuffle((item.w+extra).split(""));
    $("#selfContent").innerHTML='<div class="prompt-panel"><div><div class="self-mode-tag">🔤 點字母拼單字</div><div class="question-label">看照片和中文，把單字拼出來</div></div><div id="selfPhoto" class="photo"></div><div class="prompt-word">'+item.z+'</div></div><div class="spell-box"><div id="spellAnswer" class="spell-answer">'+"＿".repeat(item.w.length)+'</div><div id="letterBank" class="letter-bank">'+letters.map((x,i)=>'<button class="letter-tile" data-id="'+i+'" data-letter="'+x+'">'+x+'</button>').join('')+'</div><div class="row"><button class="btn" id="spellBack">⌫ 上一步</button><button class="btn" id="spellClear">清除</button><button class="btn primary" id="spellCheck">檢查答案</button></div><div id="selfFeedback" class="feedback">依序點選字母</div></div>';setPhoto($("#selfPhoto"),item);
    $$("#letterBank .letter-tile").forEach(b=>b.onclick=()=>{if(selfPractice.locked)return;b.disabled=true;selfPractice.selected.push({id:b.dataset.id,letter:b.dataset.letter});updateSpellAnswer(item)});$("#spellBack").onclick=()=>{const x=selfPractice.selected.pop();if(x){const b=$('#letterBank [data-id="'+x.id+'"]');if(b)b.disabled=false;updateSpellAnswer(item)}};$("#spellClear").onclick=()=>{selfPractice.selected=[];$$("#letterBank .letter-tile").forEach(b=>b.disabled=false);updateSpellAnswer(item)};$("#spellCheck").onclick=()=>checkSelfSpell(item)
  }
  function updateSpellAnswer(item){const text=selfPractice.selected.map(x=>x.letter).join("");$("#spellAnswer").textContent=text||"＿".repeat(item.w.length)}
  function checkSelfSpell(item){if(selfPractice.locked||!selfPractice.running)return;const answer=selfPractice.selected.map(x=>x.letter).join(""),ok=answer===item.w;$("#spellAnswer").textContent=ok?item.w:item.w+"  ✓";$("#spellAnswer").style.borderColor=ok?"#31ad84":"#e96c7f";$$("#letterBank button,#spellBack,#spellClear,#spellCheck").forEach(b=>b.disabled=true);$("#selfFeedback").textContent=ok?"Excellent spelling!":"正確拼法是 "+item.w+"，等一下再練一次";$("#selfFeedback").className="feedback "+(ok?"good":"bad");speak(item.w);completeSelf(ok,item,ok?700:1300)}
  function renderSelfWrite(item){
    $("#selfContent").innerHTML='<div class="prompt-panel"><div><div class="self-mode-tag">✍️ 自己寫單字</div><div class="question-label">看照片和中文，先自己寫英文</div></div><div id="selfPhoto" class="photo"></div><div class="prompt-word">'+item.z+'</div></div><div class="write-box"><div class="reveal-help">用手指或觸控筆寫在格子裡</div><div class="write-board"><canvas id="selfCanvas" aria-label="手寫區"></canvas></div><div id="writeActions" class="row"><button class="btn" id="writeClear">清除</button><button class="btn blue" id="writeListen">🔊 Listen</button><button class="btn primary" id="writeDone">寫好了・看答案</button></div><div id="selfFeedback" class="feedback"></div></div>';setPhoto($("#selfPhoto"),item);setupWriteCanvas();$("#writeClear").onclick=clearWriteCanvas;$("#writeListen").onclick=()=>speak(item.w);$("#writeDone").onclick=()=>revealWrittenAnswer(item)
  }
  function setupWriteCanvas(){const c=$("#selfCanvas"),ctx=c.getContext("2d"),ratio=window.devicePixelRatio||1;c.width=Math.max(1,c.clientWidth*ratio);c.height=Math.max(1,c.clientHeight*ratio);ctx.scale(ratio,ratio);ctx.lineWidth=6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#12395f";let drawing=false;c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)};c.onpointermove=e=>{if(!drawing)return;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()};c.onpointerup=c.onpointercancel=()=>drawing=false}
  function clearWriteCanvas(){const c=$("#selfCanvas"),ctx=c.getContext("2d");ctx.clearRect(0,0,c.width,c.height)}
  function revealWrittenAnswer(item){if(selfPractice.locked)return;selfPractice.locked=true;$("#writeActions").innerHTML='<div><div class="reveal-help">正確答案</div><div class="revealed-word">'+item.w+'</div><div class="row"><button class="btn blue" id="wroteRight">✓ 我寫對了</button><button class="btn red" id="wroteAgain">↻ 我還要再練</button></div></div>';speak(item.w);$("#wroteRight").onclick=()=>{selfPractice.locked=false;completeSelf(true,item,500)};$("#wroteAgain").onclick=()=>{selfPractice.locked=false;completeSelf(false,item,500)}}
  function finishSelf(){clearInterval(selfPractice.timer);selfPractice.running=false;selfPractice.time=0;selfPractice.best=Math.max(selfPractice.best,selfPractice.score);localStorage.setItem("avyL3SelfBest",selfPractice.best);localStorage.setItem("avyL3SelfLast",selfPractice.score);selfPractice.last=selfPractice.score;renderSelf()}
  function resetSelf(){clearInterval(selfPractice.timer);const {best,last}=selfPractice;selfPractice={started:false,running:false,time:900,score:0,total:0,index:0,order:shuffle(words),articleOrder:shuffle(articleWords),articleIndex:0,articleRetry:[],timer:null,locked:false,best,last,previous:0,missed:[],selected:[]};renderSelf()}
  function gameItem(){return game.order[game.index%20]}
  function renderGame(){
    $("#gameTime").textContent=game.time;$("#gameScore").textContent=game.score;$("#startPauseGame").textContent=!game.started?"Start":game.running?"Pause":"Resume";
    if(!game.started){$("#gameContent").innerHTML='<div class="game-start"><div class="game-start-inner"><div style="font-size:70px">🏆</div><h1>60-Second Team Challenge</h1><p>全班只有一隊！學生一起搶答，老師點選答案。<br>答對加 1 分，看看 60 秒可以得到幾分。</p><button class="btn primary" id="bigStart">Start Game</button></div></div>';$("#bigStart").onclick=startGame;return}
    if(game.time<=0){$("#gameContent").innerHTML=`<div class="game-end"><div class="game-end-inner"><h1>Time is up!</h1><div class="big-score">${game.score}</div><h2>Great teamwork! 🎉</h2><button class="btn primary" id="playAgain">Play Again</button></div></div>`;$("#playAgain").onclick=resetGame;return}
    const item=gameItem(),mode=game.index%2===0?"photo":"zh";
    const prompt=mode==="photo"?'<div id="gamePhoto" class="photo"></div>':'<div class="zh-prompt">'+item.z+"</div>";
    $("#gameContent").innerHTML='<div class="prompt-panel"><div class="question-label">'+(mode==="photo"?"Which word matches the photo?":"Choose the English word.")+'</div>'+prompt+'<div class="prompt-word"></div></div><div class="answer-panel"><div id="gameAnswers" class="answers">'+choices(item).map((x,i)=>'<button class="answer" data-word="'+x.w+'">'+String.fromCharCode(65+i)+". "+x.w+"</button>").join("")+'</div><div id="gameFeedback" class="feedback"></div><div class="question-actions"><button class="btn blue" id="gameNext" disabled>Next Question →</button></div></div>';
    if(mode==="photo")setPhoto($("#gamePhoto"),item);$$("#gameAnswers .answer").forEach(b=>b.onclick=()=>checkGame(b,item));$("#gameNext").onclick=nextGame
  }
  function startClock(){clearInterval(game.timer);game.running=true;game.timer=setInterval(()=>{game.time--;$("#gameTime").textContent=game.time;if(game.time<=0){clearInterval(game.timer);game.running=false;renderGame()}},1000)}
  function startGame(){game.started=true;game.time=60;game.score=0;game.index=0;game.order=shuffle(words);game.locked=false;startClock();renderGame()}
  function checkGame(btn,item){if(game.locked||!game.running)return;game.locked=true;const ok=btn.dataset.word===item.w;$$("#gameAnswers .answer").forEach(b=>{b.disabled=true;if(b.dataset.word===item.w)b.classList.add("correct")});if(!ok)btn.classList.add("wrong");if(ok)game.score++;$("#gameScore").textContent=game.score;$("#gameFeedback").textContent=ok?"Correct! +1":item.w+" = "+item.z;$("#gameFeedback").className="feedback "+(ok?"good":"bad");$("#gameNext").disabled=false;speak(item.w)}
  function nextGame(){game.index++;game.locked=false;renderGame()}
  function resetGame(){clearInterval(game.timer);game={started:false,running:false,time:60,score:0,index:0,order:shuffle(words),timer:null,locked:false};renderGame()}
  $("#startPauseGame").onclick=()=>{if(!game.started){startGame();return}if(game.running){clearInterval(game.timer);game.running=false}else startClock();renderGame()};$("#resetGame").onclick=resetGame;
  $("#zoomIn").onclick=()=>{scale=Math.min(1.15,+(scale+.05).toFixed(2));document.documentElement.style.setProperty("--scale",scale)};$("#zoomOut").onclick=()=>{scale=Math.max(.85,+(scale-.05).toFixed(2));document.documentElement.style.setProperty("--scale",scale)};
  const fullscreenBtn=$("#fullscreenBtn");
  function updateFullscreenButton(){const enlarged=!!document.fullscreenElement||document.body.classList.contains("focus-mode");fullscreenBtn.textContent=enlarged?"⛶ 還原":"⛶ 放大"}
  fullscreenBtn.onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else{document.body.classList.toggle("focus-mode")}}catch(e){document.body.classList.toggle("focus-mode")}updateFullscreenButton()};
  document.addEventListener("fullscreenchange",updateFullscreenButton);
  $("#teacherBtn").onclick=()=>{if(teacher){teacher=false;document.body.classList.remove("teacher-on");toast("老師模式已關閉")}else{$("#pinModal").classList.add("show");$("#pinInput").value="";$("#pinInput").focus()}};
  $("#cancelPin").onclick=()=>$("#pinModal").classList.remove("show");$("#confirmPin").onclick=checkPin;$("#pinInput").onkeydown=e=>{if(e.key==="Enter")checkPin()};
  function checkPin(){if($("#pinInput").value==="2468"){teacher=true;document.body.classList.add("teacher-on");$("#pinModal").classList.remove("show");toast("老師模式已開啟")}else toast("密碼不正確")}
  $("#showAnswer").onclick=()=>{if($("#practice").classList.contains("active")&&!practice.locked){const item=practice.order[practice.index];const b=$('#practiceAnswers [data-word="'+item.w+'"]');if(b){b.classList.add("correct");$("#practiceFeedback").textContent=item.w+" = "+item.z;$("#nextPractice").disabled=false}}else if($("#game").classList.contains("active")&&game.started){const item=gameItem();const b=$('#gameAnswers [data-word="'+item.w+'"]');if(b){b.classList.add("correct");$("#gameNext").disabled=false}}};
  $("#teacherNext").onclick=()=>{$("#practice").classList.contains("active")?($("#nextPractice").disabled||($("#nextPractice").click())):$("#game").classList.contains("active")&&game.started&&nextGame()};
  $("#scorePlus").onclick=()=>{game.score++;$("#gameScore").textContent=game.score};$("#scoreMinus").onclick=()=>{game.score=Math.max(0,game.score-1);$("#gameScore").textContent=game.score};
  renderLearn();renderPractice();renderArticle();renderSelf();renderGame();
</script>
